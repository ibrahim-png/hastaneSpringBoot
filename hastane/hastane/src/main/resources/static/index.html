<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hastane API İstemcisi</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #07111f;
            color: #e7eef8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background:
                radial-gradient(circle at 15% 10%, rgba(32, 178, 170, .16), transparent 32rem),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, .13), transparent 30rem),
                #07111f;
        }

        main {
            width: min(860px, 100%);
            padding: 28px;
            border: 1px solid #213249;
            border-radius: 20px;
            background: rgba(13, 27, 45, .92);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
        }

        h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 4vw, 2.2rem); }
        p { margin: 0 0 24px; color: #9db0c8; }
        label { display: block; margin-bottom: 8px; color: #c7d5e7; font-weight: 650; }

        input, select, textarea, button {
            font: inherit;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            border: 1px solid #2c405c;
            background: #091625;
            color: #f2f7fd;
            outline: none;
        }

        input, select { min-height: 46px; padding: 0 13px; }
        textarea { min-height: 150px; resize: vertical; padding: 13px; line-height: 1.5; }
        input:focus, select:focus, textarea:focus { border-color: #2dd4bf; box-shadow: 0 0 0 3px rgba(45, 212, 191, .12); }

        .field { margin-bottom: 18px; }
        .token-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        .request-row { display: grid; grid-template-columns: 125px 1fr; gap: 10px; }

        button {
            min-height: 46px;
            padding: 0 18px;
            border: 0;
            cursor: pointer;
            font-weight: 750;
        }

        .secondary { background: #263a54; color: #e7eef8; }
        .send { width: 100%; background: #2dd4bf; color: #04201d; }
        button:disabled { cursor: wait; opacity: .65; }

        .base-url {
            display: inline-block;
            margin-bottom: 22px;
            padding: 7px 10px;
            border-radius: 8px;
            background: #07111f;
            color: #6ee7d8;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: .86rem;
            overflow-wrap: anywhere;
        }

        .result-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px; }
        .result-head label { margin: 0; }
        #status { color: #9db0c8; font: 700 .9rem ui-monospace, SFMono-Regular, Consolas, monospace; }
        #result { min-height: 120px; margin: 0; white-space: pre-wrap; }
        .hint { margin-top: 7px; color: #7187a3; font-size: .82rem; }

        @media (max-width: 580px) {
            main { padding: 20px; }
            .request-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main>
    <h1>Hastane API İstemcisi</h1>
    <p>Tokenınızı girin ve korumalı endpoint’lere doğrudan istek gönderin.</p>
    <div class="base-url" id="baseUrl"></div>

    <form id="requestForm">
        <div class="field">
            <label for="token">Bearer token</label>
            <div class="token-row">
                <input id="token" name="token" type="password" autocomplete="off"
                       placeholder="eyJhbGciOiJIUzI1NiJ9...">
                <button class="secondary" id="toggleToken" type="button">Göster</button>
            </div>
            <div class="hint">Yalnızca bu sekmede tutulur; sunucuya istek dışında gönderilmez.</div>
        </div>

        <div class="field">
            <label for="path">İstek</label>
            <div class="request-row">
                <select id="method" aria-label="HTTP yöntemi">
                    <option>GET</option>
                    <option>POST</option>
                    <option>PATCH</option>
                    <option>DELETE</option>
                </select>
                <input id="path" value="/api/auth/ben" placeholder="/api/auth/ben" required>
            </div>
        </div>

        <div class="field" id="bodyField" hidden>
            <label for="requestBody">JSON gövdesi</label>
            <textarea id="requestBody" spellcheck="false" placeholder="{&#10;  &quot;alan&quot;: &quot;değer&quot;&#10;}"></textarea>
        </div>

        <button class="send" id="sendButton" type="submit">İstek gönder</button>
    </form>

    <div class="result-head">
        <label for="result">Yanıt</label>
        <span id="status">Henüz istek gönderilmedi</span>
    </div>
    <textarea id="result" readonly placeholder="API yanıtı burada görünecek."></textarea>
</main>

<script>
    const BASE_URL = "https://hastanespringboot.onrender.com";
    const form = document.querySelector("#requestForm");
    const tokenInput = document.querySelector("#token");
    const methodInput = document.querySelector("#method");
    const pathInput = document.querySelector("#path");
    const bodyField = document.querySelector("#bodyField");
    const requestBody = document.querySelector("#requestBody");
    const result = document.querySelector("#result");
    const status = document.querySelector("#status");
    const sendButton = document.querySelector("#sendButton");

    document.querySelector("#baseUrl").textContent = BASE_URL;

    const updateBodyVisibility = () => {
        bodyField.hidden = !["POST", "PATCH"].includes(methodInput.value);
    };

    methodInput.addEventListener("change", updateBodyVisibility);
    updateBodyVisibility();

    document.querySelector("#toggleToken").addEventListener("click", event => {
        const isHidden = tokenInput.type === "password";
        tokenInput.type = isHidden ? "text" : "password";
        event.currentTarget.textContent = isHidden ? "Gizle" : "Göster";
    });

    form.addEventListener("submit", async event => {
        event.preventDefault();
        const path = pathInput.value.trim();
        const token = tokenInput.value.trim().replace(/^Bearer\s+/i, "");
        const method = methodInput.value;
        const headers = { "Accept": "application/json" };

        if (!path.startsWith("/")) {
            status.textContent = "Geçersiz endpoint";
            result.value = "Endpoint yolu / ile başlamalıdır.";
            return;
        }

        if (token) headers.Authorization = `Bearer ${token}`;

        const options = { method, headers };
        if (["POST", "PATCH"].includes(method) && requestBody.value.trim()) {
            try {
                JSON.parse(requestBody.value);
            } catch {
                status.textContent = "Geçersiz JSON";
                result.value = "İstek gövdesi geçerli bir JSON olmalıdır.";
                return;
            }
            headers["Content-Type"] = "application/json";
            options.body = requestBody.value;
        }

        sendButton.disabled = true;
        sendButton.textContent = "Gönderiliyor…";
        status.textContent = "Bekleniyor…";
        result.value = "";

        try {
            const response = await fetch(`${BASE_URL}${path}`, options);
            const text = await response.text();
            status.textContent = `${response.status} ${response.statusText}`;
            try {
                result.value = JSON.stringify(JSON.parse(text), null, 2);
            } catch {
                result.value = text || "(Boş yanıt)";
            }
        } catch (error) {
            status.textContent = "İstek başarısız";
            result.value = `${error.message}\n\nTarayıcı CORS engeli gösteriyorsa bu ekranı Render üzerindeki uygulama adresinden açın.`;
        } finally {
            sendButton.disabled = false;
            sendButton.textContent = "İstek gönder";
        }
    });
</script>
</body>
</html>
