# Production profile
spring.application.name=hastane

# PostgreSQL / Neon - values must be supplied by the server environment
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server (Render supplies PORT)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Stateless JWT
security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.issuer=${JWT_ISSUER:hastane-api}
security.jwt.audience=${JWT_AUDIENCE:hastane-client}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}

# Cloudflare Turnstile - staff login bot protection
security.turnstile.enabled=${TURNSTILE_ENABLED:true}
security.turnstile.secret-key=${TURNSTILE_SECRET_KEY}
security.turnstile.expected-hostname=${TURNSTILE_EXPECTED_HOSTNAME:hastanespringboot.onrender.com}
